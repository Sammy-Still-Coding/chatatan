
[functions.curate-forum-attachment]
enabled = true
verify_jwt = false
import_map = "./functions/curate-forum-attachment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/curate-forum-attachment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/curate-forum-attachment/*.html" ]

[functions.ai-chat]
enabled = true
verify_jwt = false
entrypoint = "./functions/ai-chat/index.ts"

[functions.send-push-notification]
enabled = true
# Supabase Database Webhooks call this function, authenticated by the
# x-push-webhook-secret header checked inside the function.
verify_jwt = false
entrypoint = "./functions/send-push-notification/index.ts"
